name: iOS IPA sin firmar

on:
  workflow_dispatch:
  push:
    branches: [main, outflow-2]

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Configuración de Firebase / Google (secretos del repositorio). Sin
      # ellos la app compila igual y usa la cuenta de vista previa.
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
      GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
      # Lectura de tickets con IA (opcional).
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Tests
        run: flutter test

      # Google Sign-In vuelve a la app por el esquema REVERSED_CLIENT_ID.
      - name: Esquema de URL de Google
        if: env.GOOGLE_REVERSED_CLIENT_ID != ''
        run: |
          P=ios/Runner/Info.plist
          # Info.plist ya declara el esquema outflow:// (atajo de Apple Pay); se añade el de Google a esa lista.
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $GOOGLE_REVERSED_CLIENT_ID" "$P"
          /usr/libexec/PlistBuddy -c "Add :GIDClientID string $GOOGLE_IOS_CLIENT_ID" "$P"

      - name: Compilar iOS (sin firma)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID" \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --dart-define=GEMINI_MODEL="$GEMINI_MODEL"

      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Outflow.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Outflow-ipa
          path: Outflow.ipa
          retention-days: 14
