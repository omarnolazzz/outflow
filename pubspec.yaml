name: outflow
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  lucide_icons_flutter: ^4.0.0
  meta: ^1.19.0
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 24
